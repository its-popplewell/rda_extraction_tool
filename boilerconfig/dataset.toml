# One entry per variable, named <dataset>_<variable>: a request with
# dataset: era5 and variables: [u, v] uses era5_u and era5_v.
#
# file_pattern: a Go regexp matched against file names. It needs a key group
# (unique per file; it names the piece) and a year group, plus month and day
# groups when the file covers less than a year.
#
# ops: cdo operators. cdo applies a chain right to left, so the box goes last
# here and is cut first. {box}, {hours} and {levels} are filled from the request;
# a request that sets hours or levels the entry has no op for is refused.

# ---- ERA5 pressure levels, hourly, one file per day (RDA d633000) ----

[datasets.era5_u]
description = "ERA5 pressure-level eastward wind, hourly"
archive = "era5"
stream = "e5.oper.an.pl"
layout = "rda_month"
file_pattern = '128_131_u\.ll025uv\.(?P<key>(?P<year>\d{4})(?P<month>\d{2})(?P<day>\d{2}))00_'
ops = ["-selhour,{hours}", "-sellevel,{levels}", "-sellonlatbox,{box}"]

[datasets.era5_v]
description = "ERA5 pressure-level northward wind, hourly"
archive = "era5"
stream = "e5.oper.an.pl"
layout = "rda_month"
file_pattern = '128_132_v\.ll025uv\.(?P<key>(?P<year>\d{4})(?P<month>\d{2})(?P<day>\d{2}))00_'
ops = ["-selhour,{hours}", "-sellevel,{levels}", "-sellonlatbox,{box}"]

[datasets.era5_q]
description = "ERA5 pressure-level specific humidity, hourly"
archive = "era5"
stream = "e5.oper.an.pl"
layout = "rda_month"
file_pattern = '128_133_q\.ll025sc\.(?P<key>(?P<year>\d{4})(?P<month>\d{2})(?P<day>\d{2}))00_'
ops = ["-selhour,{hours}", "-sellevel,{levels}", "-sellonlatbox,{box}"]

[datasets.era5_t]
description = "ERA5 pressure-level temperature, hourly"
archive = "era5"
stream = "e5.oper.an.pl"
layout = "rda_month"
file_pattern = '128_130_t\.ll025sc\.(?P<key>(?P<year>\d{4})(?P<month>\d{2})(?P<day>\d{2}))00_'
ops = ["-selhour,{hours}", "-sellevel,{levels}", "-sellonlatbox,{box}"]

# ---- ERA-20C surface forecast, 3-hourly (RDA d626000) ----

[datasets.era20c_tp]
description = "ERA-20C total precipitation, daily accumulation at 06Z"
archive = "era20c"
stream = "e20c.oper.fc.sfc.3hr"
layout = "rda_decade"
file_pattern = '128_228_tp\.regn80sc\.(?P<key>(?P<year>\d{4})0101)'
ops = ["-selhour,6", "-sellonlatbox,{box}"]

# ---- MESACLIP (CESM-HR ne120) historical, 6-hourly, one file per year (RDA d651007) ----
# Levels are baked into variable names, so there is no {levels} op; requests list u850 etc.

[datasets.mesaclip_u850]
description = "MESACLIP historical 850-hPa eastward wind, 6-hourly, member .004"
archive = "mesaclip_hist"
layout = "cesm_case"
case = "b.e13.BHISTC5.ne120_t12.cesm-ihesp-hires1.0.44-1920-2005.004"
stream = "hour_6"
file_pattern = '\.cam\.h2\.U850\.(?P<key>(?P<year>\d{4})010100)-'
ops = ["-selhour,{hours}", "-selmon,11,12,1,2,3", "-sellonlatbox,{box}",
       "-setgrid,/glade/work/jackscheffel/regrid/ne120_grid.nc", "-selname,U850"]

